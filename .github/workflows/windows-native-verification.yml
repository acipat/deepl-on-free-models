name: Windows native verification
on:
  push:
    branches: [codex/windows-com-prefill-20261124]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Repeat the previously crashing ofm-app tests
        working-directory: rust
        shell: pwsh
        run: |
          foreach ($run in 1..5) {
            Write-Host "Native Windows attempt $run"
            cargo test --locked -p ofm-app --lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test translation, settings and CLI
        working-directory: rust
        run: cargo test --locked -p ofm-net -p ofm-config -p ofm-cli
  python:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install application dependencies
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Compare two-process delivery before the fix
        continue-on-error: true
        working-directory: windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git fetch --quiet --depth=1 origin 3637a0460a544ca80b0de7e91a85f1a3e64257f9
          git restore --source=3637a046 --worktree -- deepl_ofm/app.py
          try {
            python -m pytest -q tests/test_review_fixes.py::test_second_launch_applies_its_actions
            $baseline = $LASTEXITCODE
          } finally {
            git restore --worktree -- deepl_ofm/app.py
          }
          exit $baseline
      - name: Verify delivery to the first process
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rA tests/test_review_fixes.py::test_second_launch_applies_its_actions
      - name: Run the Python suite
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
