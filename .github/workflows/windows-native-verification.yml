name: Windows native verification
on:
  push:
    branches: [codex/windows-com-prefill-20261124]
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Repeat the previously crashing ofm-app tests
        working-directory: rust
        shell: pwsh
        run: |
          foreach ($run in 1..5) {
            Write-Host "Native Windows attempt $run"
            cargo test --locked -p ofm-app --lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  python:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install application dependencies
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Verify delivery to the first process
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -rA tests/test_review_fixes.py::test_second_launch_applies_its_actions
