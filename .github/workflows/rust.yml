name: rust

on:
  # On a branch only the pull request runs, so a push is not reported twice.
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The macOS runner pool is scarce here, so a pull request does not wait for
    # it; `main` and manual runs still cover macOS.
    if: matrix.os != 'macos-latest' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: rust
        run: cargo test
      - name: Build the CLI
        working-directory: rust
        run: cargo build --release -p ofm-cli
      - uses: actions/upload-artifact@v4
        if: matrix.os != 'ubuntu-latest'
        with:
          name: ofm-${{ matrix.os }}
          path: |
            rust/target/release/ofm
            rust/target/release/ofm.exe
          retention-days: 7
          if-no-files-found: warn

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: matrix.os != 'macos-latest' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the desktop shell
        working-directory: rust
        # `crates/desktop/icons/` is committed, so no icon generation is needed.
        run: cargo build --release -p ofm-desktop
