name: build

on:
  push:
    # A Python- or Rust-only change cannot break the Swift app, and the macOS
    # runner is the scarcest resource in this repository.
    paths: &swift-paths
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - "build.sh"
      - ".github/workflows/build.yml"
  pull_request:
    paths: *swift-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test
      - name: Build app
        run: ./build.sh
      - name: Build for iPhone Simulator
        run: >-
          xcodebuild -project ios/DeepL-oFM.xcodeproj -scheme DeepL-oFM
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
