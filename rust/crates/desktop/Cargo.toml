[package]
name = "ofm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
env_logger.workspace = true
log.workspace = true
ofm-config = { version = "2.0.1", path = "../config" }
ofm-i18n = { version = "2.0.1", path = "../i18n" }
ofm-platform = { version = "2.0.1", path = "../platform" }
ofm-app = { version = "2.0.1", path = "../app" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1.53.3", features = ["sync"] }

[build-dependencies]
tauri-build = "2.6.3"
