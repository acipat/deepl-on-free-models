[package]
name = "ofm-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fancy-regex = "0.20.2"
ofm-i18n = { path = "../i18n", version = "2.0.1" }
ofm-text = { path = "../text", version = "2.0.1" }
ofm-config = { path = "../config", version = "2.0.1" }

futures-util = "0.3.34"
log.workspace = true
reqwest = { version = "0.13.3", features = ["rustls", "stream", "json", "gzip", "deflate", "brotli"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.3", features = ["macros", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
